name: Build YouTube ReVanced (AR button)

on:
  workflow_dispatch:
  push:
    branches: [ar-button]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract the original APK
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          ls ext | head

      - name: Get apktool
        run: curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Disassemble dex
        run: |
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk

      - name: Apply patch
        run: |
          cp -r patch/overlay/. out/
          while read f; do rm -f "out/$f"; done < patch/delete.txt

      - name: Force pivot bar blur
        run: |
          python3 - <<'PY'
          import re
          f='out/smali_classes8/com/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar.smali'
          t=open(f).read()
          pat=re.compile(r'^([ \t]*)iput-boolean (\w+), p0, Lcom/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar;->q:Z$', re.M)
          t,n=pat.subn(lambda m: m.group(1)+'const/4 '+m.group(2)+', 0x1\n'+m.group(0), t)
          print('patched q writes:', n)
          assert n>=1
          t,z=re.subn(r'^\.field [a-z ]*\bq:Z', '.field public q:Z', t, flags=re.M)
          assert z==1
          t,y=re.subn(r'^([ \t]*)const v0, 0x7f150352\n', lambda m: m.group(0), t, flags=re.M)
          open(f,'w').write(t)
          g='out/smali_classes5/akhu.smali'
          a=open(g).read()
          pat2=re.compile(r'^([ \t]*)iput p1, p0, Lakhu;->f:I$', re.M)
          a,m=pat2.subn(lambda x: x.group(1)+'const/16 p1, 0x50\n'+x.group(0), a)
          print('patched tint alpha:', m)
          assert m==1
          a,d1=re.subn(r'(\.method public final draw\(Landroid/graphics/Canvas;\)V\n\s*\.locals \d+\n)', lambda x: x.group(1)+'    sget v0, Lapp/revanced/extension/youtube/patches/Dbg;->n:I\n    add-int/lit8 v0, v0, 0x1\n    sput v0, Lapp/revanced/extension/youtube/patches/Dbg;->n:I\n', a, count=1)
          a,d2=re.subn(r'(Landroid/graphics/Canvas;->isHardwareAccelerated\(\)Z\n(?:(?!move-result)[\s\S])*?move-result v0\n)', lambda x: x.group(1)+'    sput-boolean v0, Lapp/revanced/extension/youtube/patches/Dbg;->h:Z\n', a, count=1)
          print('patched akhu counters:', d1, d2)
          assert d1==1 and d2==1
          a,e1=re.subn(r'^\.field private final b:Landroid/view/View;', '.field public final b:Landroid/view/View;', a, flags=re.M)
          a,e2=re.subn(r'^([ \t]*)iput v0, p0, Lakhu;->d:F$', lambda x: x.group(1)+'const/high16 v0, 0x41a00000\n'+x.group(0), a, count=1, flags=re.M)
          a,e3=re.subn(r'^([ \t]*)iput p1, p0, Lakhu;->f:I$', lambda x: x.group(0)+'\n    invoke-static {p0}, Lapp/revanced/extension/youtube/patches/BlurSync;->attach(Lakhu;)V', a, count=1, flags=re.M)
          mm=re.search(r'\.method public final draw\(Landroid/graphics/Canvas;\)V[\s\S]*?\.end method', a)
          body=mm.group(0)
          body2,e4=re.subn(r'^([ \t]*)iget v2, p0, Lakhu;->a:I$', lambda x: x.group(1)+'invoke-static {p0}, Lapp/revanced/extension/youtube/patches/BlurSync;->off(Lakhu;)I\n'+x.group(1)+'move-result v2', body, count=1, flags=re.M)
          a=a.replace(body, body2)
          print('patched live offset:', e4)
          assert e4==1
          print('patched blur radius/sync:', e1, e2, e3)
          assert e1==1 and e2==1 and e3==1
          open(g,'w').write(a)
          open(g,'w').write(a)
          h='out/smali_classes2/nwr.smali'
          b=open(h).read()
          pat3=re.compile(r'(const-wide/32 v3, 0x2b861fa\n(?:(?!move-result v3)[\s\S])*?move-result v3\n)')
          b,k=pat3.subn(lambda x: x.group(1)+'    const/4 v3, 0x1\n', b, count=1)
          print('patched blur source view flag:', k)
          assert k==1
          open(h,'w').write(b)
          nw='out/smali_classes8/nwg.smali'
          c=open(nw).read()
          pat5=re.compile(r'(NavigationButtonsPatch;->useTranslucentNavigationButtons\(Z\)Z\n(?:(?!move-result)[\s\S])*?move-result v1\n)')
          c,q2=pat5.subn(lambda x: x.group(1)+'    const/4 v1, 0x1\n', c, count=1)
          print('patched translucent nav gate:', q2)
          assert q2==1
          open(nw,'w').write(c)
          PY

      - name: Rebuild dex
        run: |
          java -Xmx6g -jar apktool.jar b -f -o rebuilt.apk out
          mkdir newdex && (cd newdex && unzip -q ../rebuilt.apk 'classes*.dex')

      - name: Settings screen entry and final APK
        run: |
          python3 patch/axml_edit.py ext/res/xml/revanced_prefs.xml prefs_new.xml
          python3 patch/build_apk.py ext newdex prefs_new.xml base.apk
          ls -la base.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-ReVanced-AR-apk
          path: base.apk
          compression-level: 9
