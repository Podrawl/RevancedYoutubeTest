name: Build YouTube ReVanced (AR button)

on:
  workflow_dispatch:
  push:
    branches: [ar-button]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract the original APK
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          ls ext | head

      - name: Get apktool
        run: curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Disassemble dex
        run: |
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk

      - name: Apply patch
        run: |
          cp -r patch/overlay/. out/
          while read f; do rm -f "out/$f"; done < patch/delete.txt

      - name: Pivot bar blur (nav gate only) plus diagnostics
        run: |
          python3 - <<'PY'
          import re
          P='Lapp/revanced/extension/youtube/patches/Dbg;'
          f='out/smali_classes8/com/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar.smali'
          t=open(f).read()
          t,z=re.subn(r'^\.field [a-z ]*\bq:Z', '.field public q:Z', t, flags=re.M)
          assert z==1
          pat=re.compile(r'^([ \t]*)invoke-virtual \{p0, v0, v1, v1\}, Lcom/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar;->k\(IZZ\)V$', re.M)
          t,w=pat.subn(lambda m: m.group(0)+'\n    invoke-static {p0}, '+P+'->hook(Lcom/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar;)V', t)
          print('diag hook in PivotBar:', w)
          assert w==1
          open(f,'w').write(t)
          g='out/smali_classes5/akhu.smali'
          a=open(g).read()
          a,d1=re.subn(r'(\.method public final draw\(Landroid/graphics/Canvas;\)V\n\s*\.locals \d+\n)', lambda x: x.group(1)+'    sget v0, '+P+'->n:I\n    add-int/lit8 v0, v0, 0x1\n    sput v0, '+P+'->n:I\n', a, count=1)
          a,d2=re.subn(r'(Landroid/graphics/Canvas;->isHardwareAccelerated\(\)Z\n(?:(?!move-result)[\s\S])*?move-result v0\n)', lambda x: x.group(1)+'    sput-boolean v0, '+P+'->h:Z\n', a, count=1)
          a,e1=re.subn(r'^\.field private final ([bdef]):', r'.field public final \1:', a, flags=re.M)
          a,e3=re.subn(r'^([ \t]*)iput p1, p0, Lakhu;->f:I$', lambda x: x.group(0)+'\n    invoke-static {p0}, '+P+'->ak(Lakhu;)V', a, count=1, flags=re.M)
          print('akhu diag:', d1, d2, e1, e3)
          assert d1==1 and d2==1 and e1==4 and e3==1
          open(g,'w').write(a)
          h='out/smali_classes2/nwr.smali'
          b=open(h).read()
          pat3=re.compile(r'(iget-object v2, p0, Lnwr;->bI:Lbdxo;\n(?:(?!const-wide/32 v3, 0x2b861fa)[\s\S]){0,120}?const-wide/32 v3, 0x2b861fa)')
          b,k=pat3.subn(lambda x: 'iget-object v2, p0, Lnwr;->bI:Lbdxo;\n    invoke-static {v2}, '+P+'->cfg(Lbdxo;)V\n'+x.group(1)[len('iget-object v2, p0, Lnwr;->bI:Lbdxo;\n'):], b, count=1)
          print('cfg hook in nwr.j:', k)
          assert k==1
          open(h,'w').write(b)
          nw='out/smali_classes8/nwg.smali'
          c=open(nw).read()
          pat5=re.compile(r'(NavigationButtonsPatch;->useTranslucentNavigationButtons\(Z\)Z\n(?:(?!move-result)[\s\S])*?move-result v1\n)')
          c,q2=pat5.subn(lambda x: x.group(1)+'    invoke-static {v1}, '+P+'->nav(Z)V\n    const/4 v1, 0x1\n', c, count=1)
          print('translucent nav gate:', q2)
          assert q2==1
          open(nw,'w').write(c)
          PY

      - name: Rebuild dex
        run: |
          java -Xmx6g -jar apktool.jar b -f -o rebuilt.apk out
          mkdir newdex && (cd newdex && unzip -q ../rebuilt.apk 'classes*.dex')

      - name: Settings screen entry and final APK
        run: |
          python3 patch/axml_edit.py ext/res/xml/revanced_prefs.xml prefs_new.xml
          python3 patch/build_apk.py ext newdex prefs_new.xml base.apk
          ls -la base.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YouTube-ReVanced-AR-apk
          path: base.apk
          compression-level: 9
