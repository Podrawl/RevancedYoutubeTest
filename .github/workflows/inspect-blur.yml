name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          {
          f=out/smali_classes4/tgk.smali
          echo "== tgk size"; wc -l $f; head -5 $f
          echo "== methods"; grep -n "^.method\|^.field" $f | head -80
          echo "== frosted"; grep -n "frostedGlass\|isBarTranslucent\|Build\$VERSION\|sget.*SDK_INT\|const/16 v[0-9]*, 0x1f\|0x1f$" $f | head -40
          echo "== akhu"; grep -n "RenderEffect\|SDK_INT\|frosted" out/smali_classes5/akhu.smali | head
          echo "== tgk users"; grep -rl "Ltgk;" out | head -20
          } > res/report.txt 2>&1
          cat res/report.txt
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
