name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          P=com/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar
          F=out/smali_classes8/$P.smali
          C='grep -v "^ *\.line\|^$\|^ *\.local\|^ *\.prologue"'
          {
          echo "=== callers of k(IZZ)"; grep -rn "PivotBar;->k(IZZ)V" out | cut -c1-220
          echo "=== setBackground in PivotBar"; grep -n "setBackground\|setBackgroundColor\|setBackgroundResource" $F | cut -c1-200
          echo "=== callers of nwr.j"; grep -rn "Lnwr;->j()V" out | cut -c1-200
          echo "=== isBarTranslucent users"; grep -rln "isBarTranslucent" out | head
          } > res/report.txt 2>&1
          cat res/report.txt
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
