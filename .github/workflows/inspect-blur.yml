name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          {
          echo "== versionName"; (cd ext && ls; ) | head -50
          echo "== RenderEffect / createBlurEffect / BlurMaskFilter / blur radius users"
          grep -rlE "createBlurEffect|setBackgroundBlurRadius|setRenderEffect|setBlurBehindRadius" out | head -60
          echo "== strings containing blur"
          grep -rhoiE '"[^"]*blur[^"]*"' out | sort -u | head -80
          echo "== class names containing blur"
          find out -iname '*blur*' | head -40
          } > res/report.txt 2>&1
          cat res/report.txt | head -200
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
