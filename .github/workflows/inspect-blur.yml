name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          C='grep -v "^ *\.line\|^$\|^ *\.local\|^ *\.prologue"'
          {
          echo "=== nps 925-975"; sed -n 925,975p out/smali_classes4/nps.smali | eval $C
          echo "=== nwg 1300-1350"; sed -n 1300,1350p out/smali_classes8/nwg.smali | eval $C
          echo "=== nps method"; awk 'NR<970 && /^\.method/ {l=NR": "$0} END{print l}' out/smali_classes4/nps.smali
          echo "=== nwg method"; awk 'NR<1345 && /^\.method/ {l=NR": "$0} END{print l}' out/smali_classes8/nwg.smali
          } > res/report.txt 2>&1
          cat res/report.txt
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
