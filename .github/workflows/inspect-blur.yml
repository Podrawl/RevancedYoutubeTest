name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          F=out/smali_classes8/com/google/android/libraries/youtube/rendering/ui/pivotbar/PivotBar.smali
          {
          echo "=== nwr method start"; awk 'NR<3985 && /^\.method/ {l=NR": "$0} END{print l}' out/smali_classes2/nwr.smali
          echo "=== nwr after akhu"; sed -n 4056,4320p out/smali_classes2/nwr.smali | grep -v "^ *\.line\|^$"
          echo "=== PivotBar o uses"; sed -n 1465,1540p $F | grep -v "^ *\.line\|^$"
          echo "=== other flag users"; grep -rn "0x2b87125\|0x2b861fa" out | cut -c1-200 | head
          } > res/report.txt 2>&1
          cat res/report.txt
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
