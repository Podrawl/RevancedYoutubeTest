name: Inspect blur
on:
  workflow_dispatch:
  push:
    branches: [inspect-blur]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Extract
        run: |
          which 7z || sudo apt-get install -y p7zip-full
          7z x base.7z.001 -oext > /dev/null
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          (cd ext && zip -q ../dex_only.apk classes*.dex)
          java -Xmx6g -jar apktool.jar d -r -f -o out dex_only.apk
      - name: Grep
        run: |
          mkdir -p res
          {
          echo "== outline"; grep -n "createBlurEffect\|setRenderEffect\|setBackgroundBlurRadius\|setBlurBehindRadius" out/smali_classes2/a\$\$ExternalSyntheticApiModelOutline7.smali | head
          echo "== callers"; grep -rl 'ApiModelOutline7' out | head
          echo "== RenderEffect refs"; grep -rl "Landroid/graphics/RenderEffect;" out | head -20
          echo "== backdrop/blur resources"; grep -rhoiE 'blur[a-z_0-9]*' ext/res/values* 2>/dev/null | sort -u | head; grep -aoiE 'blur[a-z_0-9]*' ext/resources.arsc | sort -u | head -30
          echo "== bottom bar blur/translucent"; grep -rhoiE '"[^"]*(translucent|frosted|glass|backdrop)[^"]*"' out | sort -u | head -40
          echo "== nav bar flags"; grep -rhoE '"[A-Za-z_.]*(pivot|bottom_bar|nav_bar)[A-Za-z_.]*"' out | sort -u | head -60
          } > res/report.txt 2>&1
          cat res/report.txt
      - uses: actions/upload-artifact@v4
        with: { name: blur-report, path: res/report.txt }
